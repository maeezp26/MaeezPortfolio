<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" width="220" height="44">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5c8"/>
      <stop offset="100%" style="stop-color:#7b5ea7"/>
    </linearGradient>
  </defs>

  <!-- { bracket left -->
  <text x="0" y="32" font-family="'Courier New', monospace" font-size="28" font-weight="700" fill="#00f5c8">{</text>

  <!-- maeez in white -->
  <text x="18" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="#ffffff">maeez</text>

  <!-- script in gradient -->
  <text x="88" y="32" font-family="'Courier New', monospace" font-size="18" font-weight="700" fill="url(#g1)">script</text>

  <!-- } bracket right -->
  <text x="198" y="32" font-family="'Courier New', monospace" font-size="28" font-weight="700" fill="#7b5ea7">}</text>

  <!-- underscore cursor blink line -->
  <rect x="18" y="36" width="174" height="2" rx="1" fill="url(#g1)" opacity="0.5"/>
</svg>
